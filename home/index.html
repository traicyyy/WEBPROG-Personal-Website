<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracie</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="sidebar">
        <button class="tab" onclick="showContent('home')">
            <i class="fas fa-home"></i> Home
        </button>
        <button class="tab" onclick="showContent('about')">
            <i class="fas fa-user"></i> About Me
        </button>
        <button class="tab" onclick="showContent('education')">
            <i class="fas fa-graduation-cap"></i> Education
        </button>
        <button class="tab" onclick="showContent('achievements')">
            <i class="fas fa-trophy"></i> Achievements
        </button>
        <button class="tab" onclick="showContent('gallery')">
            <i class="fas fa-images"></i> Photo Gallery
        </button>
        <button class="tab" onclick="showContent('contact')">
            <i class="fas fa-envelope"></i> Contact Us
        </button>
    </div>
    <div class="content">
        <div id="home" class="content-section">
            <div class="home-container">
                <img src="https://raw.githubusercontent.com/traicyyy/WEBPROG-Personal-Website/feature/2_TCT_Customize_My_Website/home/images/me.jpg" alt="Profile Picture" class="profile-pic">
                <div class="text-content">
                    <h1>Kon'nichiwa, my name is <span class="highlight">Tracie</span></h1>
                    <h2>I am from <span class="highlight">BSIT-MI231</span></h2>
                    <p>currently taking Bachelor of Science in Information Technology</p>
                    <p>at Asia Pacific College, Makati City, Philippines.</p>
                    <button onclick="goToFacebook()">Get To Know Me More</button>
                </div>            
        </div>
        <div id="about" class="content-section">About Me</div>
        <div id="education" class="content-section">Education</div>
        <div id="achievements" class="content-section">Achievements</div>
        <div id="gallery" class="content-section">Photo Gallery</div>
        <div id="contact" class="content-section">Contact Us</div>
    </div>
    <script src="js/myScript.js"></script>
</body>
</html>
